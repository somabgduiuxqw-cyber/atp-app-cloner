name: Build and Publish Debug APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify Java environment
    shell: bash
    run: |
      set -euo pipefail
      java -version
      test -n "${JAVA_HOME:-}"
      test -d "$JAVA_HOME"
      MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
      if [ "$MAJOR_VERSION" -lt 17 ]; then
        echo "::error::Java 17 or newer is required."
        exit 1
      fi

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'

  - name: Create temporary debug keystore
    shell: bash
    run: |
      set -euo pipefail
      "$JAVA_HOME/bin/keytool" -genkeypair -noprompt \
        -keystore "$RUNNER_TEMP/debug.keystore" \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -dname "CN=Android Debug,O=Android,C=US" \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000

      test -s "$RUNNER_TEMP/debug.keystore"
      echo "Temporary debug keystore created."

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      gradle :app:assembleDebug --stacktrace --no-daemon

  - name: Verify debug APK
    id: verify_apk
    shell: bash
    run: |
      set -euo pipefail
      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -s "$APK" ]; then
        echo "::error::Debug APK is missing or empty: $APK"
        find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
        exit 1
      fi

      SIZE=$(stat -c '%s' "$APK")
      SHA256=$(sha256sum "$APK" | awk '{print $1}')

      echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
      echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
      echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"

      echo "APK size: $SIZE bytes"
      echo "SHA-256: $SHA256"

  - name: Upload debug APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14

  - name: Prepare release asset
    id: prepare_asset
    shell: bash
    env:
      REPOSITORY: ${{ github.repository }}
      RUN_NUMBER: ${{ github.run_number }}
    run: |
      set -euo pipefail

      REPO_NAME="${REPOSITORY#*/}"
      REPO_NAME=$(printf '%s' "$REPO_NAME" | tr -cd 'a-zA-Z0-9._-')
      REPO_NAME="${REPO_NAME:-app}"

      ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
      ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

      cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
      test -s "$ASSET_PATH"

      echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
      echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

  - name: Publish APK to GitHub Releases
    id: publish_release
    continue-on-error: true
    shell: bash
